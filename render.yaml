# Render "Blueprint" spec — must live at the repo root for Render to auto-detect it when
# you create a new Blueprint instance pointing at this GitHub repo.

services:
  - type: web
    name: lucidpoint-backend
    rootDir: backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: lucidpoint-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lucidpoint-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: lucidpoint-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: lucidpoint-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lucidpoint-db
          property: password
      - key: JWT_SECRET
        generateValue: true # Render generates a real random secret — never a hardcoded one
      - key: ANTHROPIC_API_KEY
        sync: false # not stored in this file — Render prompts for it in the setup wizard instead

databases:
  - name: lucidpoint-db
    plan: free
    databaseName: lucidpoint
    user: lucidpoint
