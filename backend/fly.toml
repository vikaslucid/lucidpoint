# Fly.io app config. Run `fly launch`/`fly deploy` from inside backend/ (same convention as
# the Dockerfile living here) — Fly builds from the Dockerfile in this directory automatically.
# App name must be globally unique across all Fly users; change it below if this one's taken.

app = "lucidpoint-backend"
primary_region = "bom" # Mumbai — closest region to where this is being deployed from

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
