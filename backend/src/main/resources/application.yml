server:
  port: 8080

spring:
  application:
    name: lucidpoint-backend

  datasource:
    # Reads from environment variables so real credentials never live in source control
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lucidpoint}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # Flyway now owns the schema (see migrations in db/migration/) — Hibernate just checks
      # entities match what's actually there and fails fast at startup if they've drifted,
      # rather than silently altering a live database the way "update" did.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    # This app's dev database already has this exact schema (it evolved via ddl-auto: update
    # before Flyway was introduced) — baseline-on-migrate tells Flyway "treat this database as
    # already being at baseline-version, don't try to re-run V1 against tables that already
    # exist." A fresh database (a new environment, production) has nothing to baseline against,
    # so Flyway just runs V1 normally there.
    baseline-on-migrate: true
    baseline-version: 1

app:
  jwt:
    # In production this MUST come from an environment variable / secrets manager, never hardcoded
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-me-before-deploying-anywhere-real}
    expiration-ms: 86400000   # 24 hours

  ai:
    # Empty by default — AiNotConfiguredException fires a clean 503 instead of a raw HTTP
    # failure when this isn't set, so the app runs fine locally without an Anthropic account.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-sonnet-5}
    max-tokens: 1024
    free-tier-daily-limit: 3

logging:
  level:
    in.lucidpoint.app: DEBUG
  file:
    name: app.log
